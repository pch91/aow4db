        <script>
            const namePrefixes = ["Arcane", "Feral", "Divine", "Cursed", "Mystic"];
            const nameTypes = ["Warlord", "Summoner", "Champion", "Sorcerer", "Guardian"];
            
            const placeHolderTomes = [];

          
            function HandlePage() {
                
                   jsonTomes = [...jsonTomes, ...placeHolderTomes];
                SetRandomStart();

                var yourKeyEl = document.getElementById("YourKey");
                if (yourKeyEl) yourKeyEl.textContent = getOrCreateUserEditKey();

                var tooltip = document.getElementById("tooltipKey");
                if (tooltip) {
                    var span = document.createElement("span");
                    span.innerHTML =
                        "Important! <br>This key is used to load and delete your builds, it is stored in your browser data, please save it in case it gets wiped!. You can overwrite it using Load Key";
                    addTooltipListeners(tooltip, span);
                }

                hidePageLoading();
            }

            // ── Reusable loading overlay helpers ──────────────────────────
            function showPageLoading(msg) {
                var overlay = document.getElementById("pageLoadingOverlay");
                var text = document.getElementById("pageLoadingText");
                if (overlay) { overlay.style.opacity = "1"; overlay.style.display = "flex"; }
                if (text) text.textContent = msg || "Loading…";
            }
            function hidePageLoading() {
                var overlay = document.getElementById("pageLoadingOverlay");
                if (overlay) {
                    overlay.style.opacity = "0";
                    setTimeout(function () { overlay.style.display = "none"; }, 400);
                }
            }
        </script>

            const excludedTags = ["p", "span", "div", "strong", "em"]; // excluded tags to stop breaking

            function convertHTMLToBrackets(text) {
                return text.replace(/<([a-z0-9]+)><\/\1>/gi, (match, tag) => {
                    return excludedTags.includes(tag.toLowerCase()) ? match : `[${tag}]`;

            function convertNamesToHTML(text) {
                return text.replace(/\{([^}]+)\}/g, (match, name) => {
                    const data = LookUpName(name);

                    return `<span class="named-tag" style="color: burlywood; display: inline-flex; align-items: center; gap: 4px;">

                    ${name}

            function LookUpName(name) {
                var data = GetCurrentChoiceList().find((entry) => entry.name.indexOf(name) != -1);

            function convertHTMLToNames(text) {
                return text.replace(

                    (match, name) => `{${name.trim()}}`
                );
            }

            function convertBracketsToHTML(text) {
                return text.replace(/\[([a-z0-9]+)\]/gi, (match, tag) => {
                    return excludedTags.includes(tag.toLowerCase()) ? match : `<${tag}></${tag}>`;

            }

            document.addEventListener("DOMContentLoaded", function () {

            // Seleciona o elemento de afinidade e reposiciona-lo para a direita quando necessário
            const affinityElement = document.querySelector("#currentAffinity");

            if (affinityElement) {
                // Criamos um "gatilho" invisível logo antes do elemento para monitorar o scroll
                const trigger = document.createElement("div");
                trigger.style.position = "absolute";
                trigger.style.pointerEvents = "none";
                // Posiciona o gatilho exatamente onde o elemento começa
                affinityElement.parentNode.insertBefore(trigger, affinityElement);

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        // entry.isIntersecting será FALSE quando o gatilho sair da tela
                        if (!entry.isIntersecting) {
                            affinityElement.classList.add("fixado-direita");
                        } else {
                            affinityElement.classList.remove("fixado-direita");
                        }
                    });
                }, {
                    root: null,      // Monitora em relação à janela de visualização (viewport)
                    threshold: 0     // Dispara assim que o topo sumir
                });

                observer.observe(trigger);
            }
        });

        // ─── PrintScreen ───────────────────────────────────────────────
        let capturedDataUrl = null;

        /**
         * html2canvas não renderiza `content: url(...)` no CSS.
         * Esta função percorre o clone e substitui esses elementos por
         * <img> reais, copiando TODOS os estilos computados relevantes
         * para que o resultado seja visualmente idêntico ao HTML.
         */
        function fixContentUrlElements(clone) {
            // propriedades que devem ser copiadas do computed style
            // (apenas longhands, sem shorthands, para evitar conflitos)
            var LAYOUT_PROPS = [
                "display", "position", "top", "right", "bottom", "left",
                "width", "height", "maxWidth", "maxHeight", "minWidth", "minHeight",
                "marginTop", "marginRight", "marginBottom", "marginLeft",
                "paddingTop", "paddingRight", "paddingBottom", "paddingLeft",
                "verticalAlign", "float",
                "objectFit", "objectPosition",
                "transform", "transformOrigin",
                "opacity", "filter",
                "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth",
                "borderTopLeftRadius", "borderTopRightRadius",
                "borderBottomLeftRadius", "borderBottomRightRadius",
                "boxSizing", "zoom"
            ];

            var all = clone.querySelectorAll("*");
            var toReplace = [];
            for (var i = 0; i < all.length; i++) {
                var el = all[i];
                // Fast skip: standard HTML elements are lowercase;
                // custom elements (empireorderBig, DRAGONLORDS) have uppercase
                if (el.nodeName === el.nodeName.toLowerCase()) continue;
                var style = window.getComputedStyle(el);
                var content = style.content;
                if (!content || content === "none" || content === "normal") continue;
                var m = content.match(/url\(["']?([^"')]+)["']?\)/);
                if (!m) continue;
                toReplace.push({ el: el, url: m[1] });
            }

            for (var j = 0; j < toReplace.length; j++) {
                var item = toReplace[j];
                var el = item.el;
                var url = item.url;
                var style = window.getComputedStyle(el);

                var img = document.createElement("img");
                img.src = url;

                // copia estilo inline original (se houver algo)
                if (el.style && el.style.cssText) {
                    img.style.cssText = el.style.cssText;
                }

                // copia propriedades computadas de layout
                for (var k = 0; k < LAYOUT_PROPS.length; k++) {
                    var prop = LAYOUT_PROPS[k];
                    var val = style.getPropertyValue(prop);
                    if (val && val !== "auto" && val !== "normal") {
                        img.style.setProperty(prop, val);
                    }
                }

                // Garante que o display não seja o default do <img> (inline-block)
                // se o original era inline
                if (!img.style.display || img.style.display === "inline-block") {
                    var compDisplay = style.getPropertyValue("display");
                    if (compDisplay && compDisplay !== "inline-block") {
                        img.style.setProperty("display", compDisplay);
                    }
                }

                // preserva classe/id
                if (el.className) img.className = el.className;
                if (el.id) img.id = el.id;

                el.replaceWith(img);
            }
        }

        async function printScreen() {
            const captureEl = document.getElementById("capture");
            if (!captureEl) {
                alert("Faction creator element not found.");
                return;
            }

            showPageLoading("Capturing screenshot…");

            try {
                // clone off-screen so we don't flash the visible DOM
                const clone = captureEl.cloneNode(true);
                clone.style.position = "fixed";
                clone.style.left = "-9999px";
                clone.style.top = "0";
                clone.style.zIndex = "-1";
                clone.style.pointerEvents = "none";
                document.body.appendChild(clone);

                // fix CSS content:url() elements in the clone
                fixContentUrlElements(clone);

                // afina bordas no clone para o screenshot (border-image fica
                // pesado demais no html2canvas com border-width > 4px)
                var containers = clone.querySelectorAll(".container");
                for (var ci = 0; ci < containers.length; ci++) {
                    containers[ci].style.borderWidth = "4px";
                }
                var inputs = clone.querySelectorAll(".inputfield");
                for (var ii = 0; ii < inputs.length; ii++) {
                    inputs[ii].style.borderWidth = "4px";
                }

                const canvas = await html2canvas(clone, {
                    backgroundColor: null,   // transparent – sem fundo cinza
                    scale: 2,
                    useCORS: true,
                    allowTaint: true
                });

                // remove clone
                document.body.removeChild(clone);

                capturedDataUrl = canvas.toDataURL("image/png");
                showPrintModal(capturedDataUrl);
            } catch (err) {
                console.error("PrintScreen failed:", err);
                alert("Failed to capture screenshot.");
            }
            hidePageLoading();
        }

        function showPrintModal(dataUrl) {
            // remove old modal if any
            const old = document.getElementById("printModal");
            if (old) old.remove();

            const modal = document.createElement("div");
            modal.id = "printModal";
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Screenshot Ready</h3>
                    <img class="preview-img" src="${dataUrl}" alt="Preview" />
                    <p>What do you want to do with this image?</p>
                    <div class="modal-buttons">
                        <button class="modal-btn primary" id="btnCopyImage">📋 Copy to Clipboard</button>
                        <button class="modal-btn" id="btnDownloadImage">💾 Download PNG</button>
                        <button class="modal-btn cancel" id="btnCancelModal">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            modal.style.display = "block";

            // Close on background click
            modal.addEventListener("click", function (e) {
                if (e.target === modal) closePrintModal();
            });

            // Cancel
            modal.querySelector("#btnCancelModal").addEventListener("click", closePrintModal);

            // Download
            modal.querySelector("#btnDownloadImage").addEventListener("click", function () {
                downloadImage(capturedDataUrl);
                closePrintModal();
            });

            // Copy to clipboard
            modal.querySelector("#btnCopyImage").addEventListener("click", async function () {
                await copyImageToClipboard(capturedDataUrl);
                closePrintModal();
            });
        }

        function closePrintModal() {
            const modal = document.getElementById("printModal");
            if (modal) modal.remove();
        }

        function downloadImage(dataUrl) {
            const link = document.createElement("a");
            link.download = "faction-creator-" + Date.now() + ".png";
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function copyImageToClipboard(dataUrl) {
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ "image/png": blob })
                ]);
                // brief feedback (non-blocking alert)
                showToast("Image copied to clipboard! (Ctrl+V to paste)");
            } catch (err) {
                console.error("Clipboard copy failed:", err);
                // fallback: open in new tab where user can right-click → copy
                const win = window.open("");
                win.document.write(`<img src="${dataUrl}" style="max-width:100%"/><p style="color:#fff;font-family:sans-serif">Right-click the image and choose "Copy image", then paste with Ctrl+V.</p>`);
                win.document.title = "Screenshot - Right-click to copy";
            }
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: #2e7d32; color: #fff; padding: 12px 24px;
                border-radius: 6px; font-family: "Regular", sans-serif;
                font-size: 14px; z-index: 99999; pointer-events: none;
                transition: opacity 0.4s; opacity: 1;
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 400);
            }, 2500);
        }
